name: build-publish-scan

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JF_URL: https://${{ vars.JF_URL }}
      DOCKER_REPO: docker-local
      IMAGE_NAME: my-very-cool-image
      IMAGE_TAG: ${{ github.run_number }}

      # 🔑 REQUIRED for build-scan
      JFROG_CLI_BUILD_NAME: my-build
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 OIDC login
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: github
          oidc-audience: github   # MUST match JFrog config

      - name: Verify auth
        run: jf rt ping

      # 🐳 Docker login using OIDC token
      - name: Docker login
        run: |
          jf docker login $JF_URL

      # 🐳 Build image
      - name: Build Docker image
        run: |
          docker build -t ${{ vars.JF_URL }}/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG .

      # 📤 Push with build-info
      - name: Push image with build-info
        run: |
          jf docker push $JF_URL/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG \
            --build-name=$JFROG_CLI_BUILD_NAME \
            --build-number=$JFROG_CLI_BUILD_NUMBER

      # 📦 Publish build-info
      - name: Publish build info
        run: |
          jf rt build-publish $JFROG_CLI_BUILD_NAME $JFROG_CLI_BUILD_NUMBER

      # 🔍 Xray scan
      - name: Scan build (Xray)
        run: |
          jf build-scan $JFROG_CLI_BUILD_NAME $JFROG_CLI_BUILD_NUMBER \
            --vuln \
            --fail=false
